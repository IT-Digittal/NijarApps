<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recomendaciones IA · Vista de Gobierno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="assets/vg.css">
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/vg.js"></script>
<script>
(function () {
  const { bar, donut } = VG;
  const MODS = ["Todas", "Alumbrado", "Agua", "Residuos", "Movilidad", "Seguridad", "Energía", "Turismo"];
  const filtros = `<div class="filtros" role="group" aria-label="Filtrar por módulo">${MODS.map((m, i) => `<button type="button" class="fbtn${i ? "" : " on"}" data-f="${m}">${m}</button>`).join("")}</div>`;

  VG.render({
    active: "recomendaciones", crumb: "Recomendaciones IA",
    title: "Recomendaciones IA · Decisiones y seguimiento",
    intro: "Cada recomendación con su impacto en euros o servicio, su responsable y su estado, hasta comprobar el ahorro real.",
    hero: {
      bg: "radial-gradient(circle at 85% 15%,rgba(160,140,255,.45),transparent 55%),linear-gradient(150deg,#16163f,#3a3d8f)",
      top: "Recomendaciones IA · 4.º trimestre de 2026",
      titulo: "31.000 € ya ahorrados con 9 recomendaciones ejecutadas",
      sub: "6 decisiones pendientes con 74.000 € al año en juego. El ahorro real va un 18 % por debajo del estimado.",
      chips: [["24", "Propuestas"], ["15", "Aceptadas"], ["9", "Ejecutadas"], ["74.000 €", "En juego al año"]],
      ring: { v: "82 %", l: "ahorro real frente al estimado", pct: 82, c: "#a99bff" },
    },
    kpis: [
      { l: "Pendientes de decidir", v: "6", d: "2 críticas", dg: "malo", s: "esta semana", tag: "real", i: "bell", c: "coral", spark: [3, 5, 4, 7, 5, 6] },
      { l: "Tiempo de decisión", v: "4,2", u: "días", d: "−1,1", dg: "bueno", s: "media del trimestre", tag: "real", i: "clock", c: "navy", spark: [6.8, 6.1, 5.9, 5.3, 4.8, 4.2] },
      { l: "Ahorro realizado", v: "31.000", u: "€", d: "de 38.000 €", dg: "neutro", s: "estimados", tag: "estimado", i: "euro", c: "ok", spark: [4, 9, 15, 21, 27, 31] },
      { l: "Tasa de aceptación", v: "63", u: "%", d: "+8 pts", dg: "bueno", s: "15 de 24", tag: "real", i: "chart", c: "teal", spark: [48, 52, 55, 58, 61, 63] },
      { l: "Coste de la IA", v: "41", u: "USD/mes", d: "−6 %", dg: "bueno", s: "chatbot + traducción", tag: "real", i: "ai", c: "violet", spark: [52, 48, 46, 44, 43, 41] },
      { l: "Conversaciones IA", v: "14.300", d: "+11 %", dg: "bueno", s: "0,003 USD cada una", tag: "real", i: "users", c: "blue", spark: [9.8, 10.9, 11.6, 12.4, 12.9, 14.3] },
    ],
    rows: [
      [
        { span: 4, t: "Embudo de decisiones del trimestre", s: "De la propuesta al ahorro comprobado",
          parts: [{ k: "funnel", items: [["Propuestas", 24, "#7C6BF0", "por la IA"], ["Aceptadas", 15, "#1A5FD0", "63 % de las propuestas"], ["Ejecutadas", 9, "#17A394", "60 % de las aceptadas"], ["Ahorro verificado", 7, "#2F9E5F", "con datos de consumo"]] }],
          f: "Estados ya disponibles en la plataforma: pendiente, en revisión, aceptada, descartada, ejecutada" },
        { span: 8, t: "Ahorro estimado frente a realizado", s: "Por mes de ejecución · el alumbrado cumple, la energía va por detrás", tag: "estimado",
          parts: [{ k: "chart", h: 260, alt: "Ahorro estimado y realizado por mes",
            legend: [["Estimado", "muted"], ["Realizado", "ok"]],
            cfg: bar(["jul", "ago", "sep", "oct"], [{ n: "Estimado", d: [6200, 9800, 11400, 10600], c: "#B4BFD3" }, { n: "Realizado", d: [5900, 8100, 9200, 7800], c: "ok" }], { unit: "€", thick: 34 }) }] },
      ],
      { h: "Decisiones pendientes", hs: "Acepta, pon en revisión o descarta; el estado queda registrado" },
      { raw: filtros },
      [
        { span: 8, parts: [{ k: "recs", items: [
          { prio: "critica", mod: "Seguridad", t: "Reparar la cámara del paseo de San José", p: "4 días sin comunicación y mercadillo el sábado con 3.200 personas.", imp: "Cobertura", plazo: "48 h", resp: "Mantenimiento" },
          { prio: "critica", mod: "Agua", t: "Búsqueda activa de fugas en San José Norte", p: "Caudal nocturno por encima del umbral 9 días seguidos; el sector pierde el 27 %.", imp: "14.000 €/año", plazo: "Esta semana", resp: "Concesionaria" },
          { prio: "alta", mod: "Alumbrado", t: "Renovar las 310 VSAP de Campohermoso", p: "Mayor bolsa de VSAP e incidencias del municipio; retorno en 3 años.", imp: "18.000 €/año", plazo: "Q1 2027", resp: "Servicios Técnicos" },
          { prio: "alta", mod: "Residuos", t: "Adelantar la ruta de envases de San José", p: "12 contenedores superarán el 95 % antes del sábado.", imp: "Evita 12 desbordes", plazo: "Viernes", resp: "Distromel" },
          { prio: "alta", mod: "Movilidad", t: "Aviso de saturación y lanzadera desde San José", p: "Genoveses y Mónsul al 100 % de 13:00 a 16:00 el sábado.", imp: "−600 vehículos", plazo: "Sábado", resp: "Policía Local" },
          { prio: "alta", mod: "Energía", t: "FV en las 5 cubiertas de mayor consumo diurno", p: "Autoconsumo del 4 % al 15 % en edificios municipales.", imp: "42.000 €/año", plazo: "2027", resp: "Área de Energía" },
          { prio: "media", mod: "Turismo", t: "Campaña de temporada baja en DE y FR", p: "Afluencia −31 % hasta mediados de noviembre.", imp: "+2.400 visitantes", plazo: "2 semanas", resp: "Turismo" },
        ] }] },
        { span: 4, t: "Resumen semanal para Alcaldía", s: "Generado el lunes 19 de octubre", ai: true,
          parts: [{ k: "html", html: `<p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--ink)">Semana estable: el índice de ciudad se mantiene en 84. Preocupan dos puntos de San José: una cámara sin servicio antes del mercadillo y una probable fuga en el sector norte. El LED sigue ahorrando 6.800 € al mes y el consumo de edificios baja un 6 %. Se espera un pico de visitantes en Todos los Santos y saturación de playas el sábado.</p>` },
                  { k: "mini", items: [["14.300", "Conversaciones IA"], ["41 USD", "Coste del mes"]] },
                  { k: "chart", h: 150, alt: "Coste de IA por servicio", legend: [["Chatbot", "violet"], ["Traducción", "teal"]], cfg: donut(["Chatbot", "Traducción"], [33, 8], ["violet", "teal"], { unit: "USD" }) }],
          f: "GET /dashboards/ia/consumo · se envía en PDF a Alcaldía y concejalías" },
      ],
    ],
    after(m) {
      const bs = m.querySelectorAll(".fbtn");
      bs.forEach((b) => b.addEventListener("click", () => {
        bs.forEach((x) => x.classList.toggle("on", x === b));
        m.querySelectorAll(".rec[data-mod]").forEach((r) => { r.hidden = b.dataset.f !== "Todas" && r.dataset.mod !== b.dataset.f; });
      }));
    },
  });
})();
</script>
</body>
</html>
