<!doctype html>
<html lang="es">
<head>

<title>Vista de Gobierno 2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@800;900&display=swap">

<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/vg.js"></script>
<script>
(function () {
  const { line, bar, donut, band, spark } = VG;
  const meses = ["nov", "dic", "ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov*", "dic*"];
  const N = null;

  const TILES = [

    ["alumbrado.html", "Alumbrado público", "ambar", "Necesita seguimiento", "radial-gradient(circle at 80% 16%,rgba(255,199,90,.55),transparent 55%),linear-gradient(160deg,#14284f,#3c5b9b)", "97,8 % disponibilidad · 31 incidencias", "9.800 €", "coste del mes", [80, 79, 74, 70, 66, 58, 54, 52, 55, 60, 64, 61], "#ffd27a"],
    ["agua.html", "Ciclo del agua", "ambar", "Necesita seguimiento", "url('assets/img/playas.jpg')", "3 fugas · rendimiento 80 %", "49.000 €", "pérdidas de red/mes", [78, 78, 79, 77, 78, 79, 80, 79, 78, 79, 80, 80], "#9fd7ff"],
    ["residuos.html", "Residuos", "ambar", "Necesita seguimiento", "radial-gradient(circle at 85% 10%,rgba(120,220,170,.35),transparent 55%),linear-gradient(160deg,#0d3b2e,#2e7d5b)", "94 contenedores ≥ 80 % · media 54 %", "1.480 t", "recogidas en octubre", [1.3, 1.25, 1.2, 1.25, 1.4, 1.66, 2.06, 2.26, 1.74, 1.48], "#9ff0c7"],
    ["movilidad.html", "Movilidad", "verde", "Funciona con normalidad", "url('assets/img/rutas.jpg')", "540 veh/h · ocupación de parking 86 %", "Sáb.", "saturación prevista 13–16 h", [420, 450, 470, 520, 610, 700, 760, 720, 600, 540], "#7fe0b0"],
    ["seguridad.html", "Seguridad", "ambar", "Necesita seguimiento", "radial-gradient(circle at 80% 20%,rgba(120,150,230,.35),transparent 55%),linear-gradient(160deg,#1b2438,#46587e)", "96 % cámaras online · 1 sin comunicación", "92 %", "ANS de reparación", [97, 98, 97, 96, 98, 97, 96, 95, 96, 96], "#ffd27a"],
    ["energia.html", "Energía municipal", "verde", "Funciona con normalidad", "url('assets/img/naturaleza.jpg')", "467.921 kWh/mes · autoconsumo 4 %", "88.600 €", "coste del mes · −6 %", [490, 470, 452, 428, 441, 488, 553, 571, 507, 468], "#7fe0b0"],
  ];
  const tilesHtml = `<div class="tiles">${TILES.map(([h, n, e, f, bg, ind, cv, cl, sp, sc]) => `
    <a class="tile" href="${h}" style="background-image:${bg}">
      <span class="estado"><span class="dot dot--${e}"></span>${f}</span>
      <h4>${n}</h4><span class="tile-f">${ind}</span>
      <div class="tile-b"><span class="tile-c"><b>${cv}</b>${cl}</span>${spark(sp, sc, { w: 90, h: 28 })}</div>
    </a>`).join("")}</div>`;

  VG.render({
    active: "resumen",
    title: "Cuadro de Mando de Dirección · Smart City Níjar",
    intro: "Visión ejecutiva de los servicios municipales: estado, coste, tendencia, lo que viene esta semana y las decisiones pendientes.",
    hero: {
      img: "assets/img/hero.jpg", top: "Ayuntamiento de Níjar · Smart City · viernes, 23 de octubre",
      titulo: "Níjar funciona bien, con 4 áreas en seguimiento",
      sub: "3 de 7 servicios municipales en correcto estado · disponibilidad media del 91,3 % · el índice sube 6 puntos en 12 meses",
      chips: [["3 / 7", "Servicios en verde"], ["18°", "Aire razonable"], ["1", "Incidencia crítica"], ["77,2 %", "Satisfacción ciudadana"]],
      ring: { v: "84", l: "de 100 · objetivo 85", pct: 84, c: "gold" },
    },
    kpis: [
      { l: "Gasto energético del mes", v: "98.400", u: "€", d: "−6 %", dg: "bueno", s: "vs oct 2025", tag: "real", i: "euro", c: "navy", spark: [112, 108, 104, 101, 99, 97, 104, 109, 103, 98.4] },
      { l: "Ahorro acumulado 2026", v: "212.000", u: "€", d: "+18 %", dg: "bueno", s: "LED + autoconsumo", tag: "estimado", i: "leaf", c: "ok", spark: [18, 39, 61, 82, 104, 126, 148, 170, 191, 212] },
      { l: "CO₂ evitado", v: "168", u: "t/año", d: "+11 t", dg: "bueno", s: "frente a 2025", tag: "estimado", i: "leaf", c: "teal", spark: [140, 144, 148, 151, 155, 158, 160, 163, 166, 168] },
      { l: "Incidencias críticas", v: "1", vc: "coral", d: "ANS 94 %", dg: "bueno", s: "cumplimiento", tag: "real", i: "alert", c: "coral", spark: [3, 2, 4, 2, 1, 2, 3, 1, 2, 1] },
      { l: "Satisfacción ciudadana", v: "77,2", u: "%", d: "+2,1 pts", dg: "bueno", s: "NPS chatbot y tótems", tag: "real", i: "users", c: "violet", spark: [72, 73, 73, 74, 75, 74, 76, 76, 77, 77.2] },
      { l: "Visitantes previstos", v: "18.600", d: "+12 %", dg: "neutro", s: "semana del 26 oct", tag: "modelo", i: "turismo", c: "blue", spark: [27.4, 24.1, 21.8, 20.3, 19.6, 21.4, 16.6, 18.6] },
    ],
    rows: [
      { h: "Los servicios del municipio, de un vistazo", hs: "Toca un servicio para abrir su panel" },
      { raw: tilesHtml },
      [
        { span: 8, t: "Índice de ciudad: 12 meses y previsión", s: "Se mantiene por encima de 80 desde marzo; la previsión toca el objetivo en diciembre", tag: "modelo",
          parts: [{ k: "chart", h: 270, alt: "Índice de ciudad mensual con previsión",
            legend: [["Índice real", "navy"], ["Previsión", "blue", 1], ["Objetivo 85", "gold", 1]],
            cfg: line(meses, [
              { n: "Índice", d: [78, 79, 81, 80, 82, 83, 81, 80, 83, 85, 84, 84, N, N], c: "navy", fill: true, pts: 3 },
              { n: "Previsión", d: [N, N, N, N, N, N, N, N, N, N, N, 84, 84.6, 85.3], c: "blue", dash: true },
              ...band(meses, [N, N, N, N, N, N, N, N, N, N, N, 84, 82.8, 82.6], [N, N, N, N, N, N, N, N, N, N, N, 84, 86.4, 88], "blue"),
              { n: "Objetivo", d: Array(14).fill(85), c: "gold", dash: true, pts: 0, w: 1.5 },
            ], { min: 70, max: 90 }) }],
          f: "Media ponderada del estado de los 7 servicios · * previsión" },
        { span: 4, t: "Decisiones pendientes", s: "74.000 €/año en juego", ai: true,
          parts: [{ k: "recs", items: [
            { prio: "alta", t: "Renovar 310 VSAP en Campohermoso", p: "Retorno en 3 años con el ahorro energético.", imp: "18.000 €/año", plazo: "Q1 2027" },
            { prio: "critica", t: "Reparar la cámara del paseo de San José", p: "4 días sin comunicación y mercadillo el sábado.", imp: "Cobertura", plazo: "48 h" },
          ] }], f: "Ver las 6 pendientes en Recomendaciones IA" },
      ],
      [
        { span: 4, t: "Esta semana en Níjar", s: "Agenda municipal y afluencia prevista",
          parts: [{ k: "evs", items: [
            ["24", "oct", "Mercadillo de San José", "Paseo marítimo · 9:00–14:00", "<b>3.200</b> pers."],
            ["25", "oct", "Ruta de los molinos", "Fernán Pérez · senderismo", "<b>180</b> inscr."],
            ["31", "oct", "Festival de la Alfarería", "Níjar casco histórico", "<b>5.400</b> pers."],
            ["1", "nov", "Todos los Santos", "Pico de visitantes previsto", "<b>+12 %</b>"],
          ] }] },
        { span: 4, t: "Tiempo, playas y Parque", s: "Open-Meteo · ThingsBoard",
          parts: [{ k: "mini", items: [["23° / 15°", "Hoy · soleado"], ["18 km/h", "Levante suave"], ["34 / 34", "Banderas operativas"], ["72 %", "Aforo del Parque"]] },
                  { k: "gauges", items: [[72, "Parque Natural", "teal"], [86, "Parkings playa", "gold"], [54, "Llenado contenedores", "navy"]] }] },
        { span: 4, t: "Estado por núcleo", s: "Peor semáforo de sus servicios",
          parts: [{ k: "map", points: [
            { n: "Níjar", lon: -2.206, lat: 36.967, e: "verde", v: "todo en verde", left: true },
            { n: "Campohermoso", lon: -2.125, lat: 36.94, e: "ambar", v: "residuos" },
            { n: "San Isidro", lon: -2.13, lat: 36.906, e: "verde", left: true },
            { n: "Las Negras", lon: -2.003, lat: 36.875, e: "verde" },
            { n: "Agua Amarga", lon: -1.935, lat: 36.937, e: "verde" },
            { n: "Rodalquilar", lon: -2.04, lat: 36.846, e: "verde", left: true },
            { n: "San José", lon: -2.105, lat: 36.765, e: "rojo", v: "cámara · agua" },
          ] }] },
      ],
      [
        { span: 6, t: "¿En qué se va el gasto energético?", s: "98.400 € en octubre · alumbrado y edificios", tag: "real",
          parts: [{ k: "chart", h: 230, alt: "Gasto energético por uso",
            legend: [["Educación", "navy"], ["Deportes", "blue"], ["Administración", "teal"], ["Cultura y social", "violet"], ["Alumbrado", "gold"]],
            cfg: donut(["Educación", "Deportes", "Administración", "Cultura y social", "Alumbrado"], [29400, 25100, 21300, 12800, 9800], ["navy", "blue", "teal", "violet", "gold"], { unit: "€", cutout: "64%" }) }] },
        { span: 6, t: "El turismo crece frente al año pasado", s: "Variación interanual · fuentes oficiales", tag: "real",
          parts: [{ k: "chart", h: 230, alt: "Variación interanual de indicadores turísticos",
            cfg: bar(["Gasto turístico", "Pasajeros AENA", "Pernoctaciones", "Viajeros alojados", "Turistas internac."], [{ n: "Variación", d: [6.8, 6.0, 4.2, 3.1, 2.4], c: ["teal", "teal", "teal", "teal", "teal"] }], { horizontal: true, unit: "%", fmt: (v) => VG.nf(v, 1), min: 0, max: 8, thick: 22 }) }],
          f: "INE EGATUR, AENA, INE EOH, Junta de Andalucía, FRONTUR · último periodo publicado" },
      ],
    ],
  });
})();
</script>
</body>
</html>
