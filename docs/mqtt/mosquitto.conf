# =============================================================================
# Plataforma DTI Níjar — Configuración Eclipse Mosquitto (desarrollo)
# =============================================================================
# AVISO: esta configuración permite conexiones anónimas y solo se usa en el
# entorno docker-compose local. En staging/producción se exige autenticación
# por certificado y TLS, conforme a ENS Medio.
# =============================================================================

# --- Listener MQTT estándar ---
listener 1883
protocol mqtt
allow_anonymous true

# --- Listener WebSockets (para clientes web) ---
listener 9001
protocol websockets
allow_anonymous true

# --- Persistencia ---
persistence true
persistence_location /mosquitto/data/

# --- Logs ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
connection_messages true

# --- Límites razonables para desarrollo ---
max_connections 200
max_queued_messages 1000
max_inflight_messages 20

# =============================================================================
# CONFIGURACIÓN DE PRODUCCIÓN (ejemplo de referencia, NO ACTIVA)
