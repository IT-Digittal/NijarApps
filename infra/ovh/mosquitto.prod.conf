# =============================================================================
# Plataforma DTI Níjar — Configuración Eclipse Mosquitto (PRODUCCIÓN)
# =============================================================================
# A diferencia de docs/mqtt/mosquitto.conf (desarrollo), aquí:
#   - Las conexiones anónimas están PROHIBIDAS.
#   - Se exige usuario/contraseña (fichero passwd).
#   - El listener 1883 solo es alcanzable desde la red interna de Docker
#     (el compose de producción no publica el puerto al host).
#
# Crear el fichero de contraseñas (desde infra/ovh/):
#   docker run --rm -v "$PWD:/work" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /work/mosquitto_passwd nijar-platform '<CONTRASEÑA>'
# y usar ese usuario/contraseña en MQTT_USERNAME / MQTT_PASSWORD del .env.
# =============================================================================

# --- Listener interno (red Docker) ---
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Persistencia ---
persistence true
persistence_location /mosquitto/data/

# --- Logs ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
connection_messages true

# --- Límites ---
max_connections 500
max_queued_messages 1000
max_inflight_messages 20

# =============================================================================
# LISTENER EXTERNO TLS (activar SOLO si los sensores publican desde Internet)
# -----------------------------------------------------------------------------
# 1. Generar/obtener certificados y montarlos en /mosquitto/certs.
# 2. Descomentar este bloque y publicar "8883:8883" en el compose.
# 3. Abrir 8883/tcp en el firewall del VPS y en el firewall de OVH.
# =============================================================================
# listener 8883
# protocol mqtt
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
