# =============================================================================
# External Secrets Operator — sincroniza secretos desde AWS Secrets Manager
# =============================================================================
# Requiere instalar el operador antes:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: nijar-dti
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: nijar-api

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nijar-api-secrets
  namespace: nijar-dti
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: nijar-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: nijar-dti-production/api/secret-key
    - secretKey: DATABASE_URL
      remoteRef:
        key: nijar-dti-production/api/database-url
    - secretKey: TWITTER_BEARER_TOKEN
      remoteRef:
        key: nijar-dti-production/social/twitter-bearer
    - secretKey: FACEBOOK_ACCESS_TOKEN
      remoteRef:
        key: nijar-dti-production/social/facebook-token
    - secretKey: FACEBOOK_PAGE_ID
      remoteRef:
        key: nijar-dti-production/social/facebook-page-id
    - secretKey: INSTAGRAM_BUSINESS_ACCOUNT_ID
      remoteRef:
        key: nijar-dti-production/social/instagram-account-id
    - secretKey: GA4_PROPERTY_ID
      remoteRef:
        key: nijar-dti-production/analytics/ga4-property-id
    - secretKey: GA4_SERVICE_ACCOUNT_JSON
      remoteRef:
        key: nijar-dti-production/analytics/ga4-sa-json
    - secretKey: INITIAL_ADMIN_PASSWORD
      remoteRef:
        key: nijar-dti-production/api/admin-password
