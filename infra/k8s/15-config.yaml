# =============================================================================
# Configuración (ConfigMap) y secretos (Secret externo de External Secrets)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nijar-api-config
  namespace: nijar-dti
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  LOG_LEVEL: "INFO"
  CORS_ALLOWED_ORIGINS: "https://dti.nijar.es,https://www.turismonijar.es"
  REDIS_URL: "rediss://nijar-dti-production-redis.cache.amazonaws.com:6379/0"
  MQTT_BROKER_HOST: "mqtt.nijar-dti.svc.cluster.local"
  MQTT_BROKER_PORT: "1883"
  MQTT_TOPIC_PATTERN: "nijar/sensors/+/+"
  CHATBOT_ENGINE: "rasa"
  RASA_URL: "http://rasa.nijar-dti.svc.cluster.local:5005"
  RASA_FALLBACK_TO_LEXICAL: "true"
  SOCIAL_LISTENING_ENABLED: "true"
  SOCIAL_DRY_RUN: "false"
  SOCIAL_POLLING_INTERVAL_MINUTES: "15"

---
# Stub del Secret. En producción se sincroniza desde AWS Secrets Manager
# mediante External Secrets Operator (manifest separado en 20-external-secrets.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: nijar-api-secrets
  namespace: nijar-dti
type: Opaque
stringData:
  SECRET_KEY: "REEMPLAZAR-EN-PRODUCCION"
  DATABASE_URL: "postgresql+asyncpg://nijar_admin:REEMPLAZAR@db-host:5432/nijar_dti"
  TWITTER_BEARER_TOKEN: ""
  FACEBOOK_ACCESS_TOKEN: ""
  FACEBOOK_PAGE_ID: ""
  INSTAGRAM_BUSINESS_ACCOUNT_ID: ""
  GA4_PROPERTY_ID: ""
  GA4_SERVICE_ACCOUNT_JSON: ""
  INITIAL_ADMIN_PASSWORD: "REEMPLAZAR-EN-PRODUCCION"
