  utter_ruta_faro_vela_blanca:
  - text: Es uno de los senderos costeros más espectaculares del Parque, de unos 4
      km. Sale del Faro de Cabo de Gata y llega al mirador de Vela Blanca con vistas
      a los acantilados volcánicos. Apto para senderistas y cicloturistas.
    condition:
    - type: slot
      name: language
      value: es
  - text: One of the park's most spectacular coastal trails, about 4 km. It starts
      at Cabo de Gata Lighthouse and reaches Vela Blanca viewpoint with views of the
      volcanic cliffs. Suitable for walkers and cyclists.
    condition:
    - type: slot
      name: language
      value: en
  - text: Einer der spektakulärsten Küstenwege des Parks, etwa 4 km. Beginnt am Leuchtturm
      von Cabo de Gata und endet am Aussichtspunkt Vela Blanca mit Blick auf vulkanische
      Klippen. Für Wanderer und Radfahrer geeignet.
    condition:
    - type: slot
      name: language
      value: de
  - text: L'un des sentiers côtiers les plus spectaculaires du parc, environ 4 km.
      Du phare de Cabo de Gata jusqu'au belvédère de Vela Blanca avec vue sur les
      falaises volcaniques. Adapté aux randonneurs et cyclistes.
    condition:
    - type: slot
      name: language
      value: fr
  - text: Es uno de los senderos costeros más espectaculares del Parque, de unos 4
      km. Sale del Faro de Cabo de Gata y llega al mirador de Vela Blanca con vistas
      a los acantilados volcánicos. Apto para senderistas y cicloturistas.
  utter_donde_dormir:
  - text: Las opciones principales se concentran en San José (la mayor oferta hotelera
      y de apartamentos), Níjar pueblo (alojamientos rurales con encanto), Las Negras
      y La Isleta del Moro (pesqueros con apartamentos). Hay también campings autorizados.
      Consulta la sección de servicios turísticos publicados.
    condition:
    - type: slot
      name: language
      value: es
  - text: Main options are concentrated in San José (largest hotel and apartment offer),
      Níjar village (charming rural stays), Las Negras and La Isleta del Moro (fishing
      villages with apartments). Authorised campsites are also available. Check the
      published tourist services section.
    condition:
    - type: slot
      name: language
      value: en
  - text: Die Hauptoptionen befinden sich in San José (größtes Hotel- und Apartmentangebot),
      Níjar Dorf (charmante ländliche Unterkünfte), Las Negras und La Isleta del Moro
      (Fischerorte mit Apartments). Es gibt auch genehmigte Campingplätze.
    condition:
    - type: slot
      name: language
      value: de
  - text: Les principales options sont concentrées à San José (plus grande offre hôtelière
      et appartements), village de Níjar (logements ruraux de charme), Las Negras
      et La Isleta del Moro (villages de pêcheurs avec appartements). Campings autorisés
      disponibles.
    condition:
    - type: slot
      name: language
      value: fr
  - text: Las opciones principales se concentran en San José (la mayor oferta hotelera
      y de apartamentos), Níjar pueblo (alojamientos rurales con encanto), Las Negras
      y La Isleta del Moro (pesqueros con apartamentos). Hay también campings autorizados.
