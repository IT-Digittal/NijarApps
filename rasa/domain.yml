      de autobuses de Almería y página oficial del Ayuntamiento.'
    condition:
    - type: slot
      name: language
      value: es
  - text: In high season (July-August-September) a shuttle bus operates from San José
      to Mónsul and Genoveses beaches. Regular bus lines run from Almería city to
      San José and Níjar village. More info at Almería bus stations and the council's
      website.
    condition:
    - type: slot
      name: language
      value: en
  - text: In der Hochsaison (Juli-August-September) verkehrt ein Pendelbus von San
      José zu den Stränden Mónsul und Genoveses. Regelmäßige Buslinien fahren von
      Almería-Stadt nach San José und ins Dorf Níjar.
    condition:
    - type: slot
      name: language
      value: de
  - text: En haute saison (juillet-août-septembre), une navette circule depuis San
