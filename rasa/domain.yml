  utter_gastronomia_tapas:
  - text: Sí, en Almería es tradición que la tapa acompañe gratis a la bebida. En
      los bares de Níjar y los pueblos podrás disfrutar de esta costumbre.
    condition:
    - type: slot
      name: language
      value: es
  - text: Yes, in Almería it is traditional for a free tapa to come with your drink.
      In the bars of Níjar and the villages you can enjoy this custom.
    condition:
    - type: slot
      name: language
      value: en
  - text: Ja, in Almería ist es Tradition, dass zum Getränk eine kostenlose Tapa serviert
      wird. In den Bars von Níjar und den Dörfern gilt dieser Brauch.
    condition:
    - type: slot
      name: language
      value: de
  - text: Oui, à Almería, il est de tradition qu'une tapa gratuite accompagne la boisson.
