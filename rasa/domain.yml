  utter_centro_salud:
  - text: Sí, hay centros de salud en Níjar pueblo, San Isidro, Campohermoso y San
      José. Para urgencias graves debe acudir al Hospital Torrecárdenas en Almería
      capital o llamar al 112. Horarios concretos en la web del Servicio Andaluz de
      Salud.
    condition:
    - type: slot
      name: language
      value: es
  - text: Yes, health centres are located in Níjar village, San Isidro, Campohermoso
      and San José. For serious emergencies go to Torrecárdenas Hospital in Almería
      or call 112. Specific hours on the Andalusian Health Service website.
    condition:
    - type: slot
      name: language
      value: en
  - text: Ja, Gesundheitszentren befinden sich in Níjar Dorf, San Isidro, Campohermoso
      und San José. Bei schweren Notfällen das Krankenhaus Torrecárdenas in Almería
      oder die 112 anrufen.
    condition:
    - type: slot
      name: language
      value: de
  - text: Oui, des centres de santé sont à Níjar village, San Isidro, Campohermoso
