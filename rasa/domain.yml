  utter_playas_destacadas:
  - text: 'Las playas más conocidas son: Mónsul (icónica, con aforo limitado en verano),
      Genoveses (virgen y muy extensa), Playazo (junto al castillo de San Ramón) y
      Cala de Enmedio (sólo accesible a pie). Todas están dentro del Parque Natural
      Cabo de Gata-Níjar.'
    condition:
    - type: slot
      name: language
      value: es
  - text: 'The most famous beaches are: Mónsul (iconic, capacity-limited in summer),
      Genoveses (vast and unspoilt), Playazo (next to San Ramón Castle) and Cala de
      Enmedio (foot-access only). All are inside the Cabo de Gata-Níjar Natural Park.'
    condition:
    - type: slot
      name: language
      value: en
  - text: 'Die bekanntesten Strände sind: Mónsul (ikonisch, im Sommer mit Zugangsbeschränkung),
      Genoveses (unberührt und weitläufig), Playazo (neben der Burg San Ramón) und
      Cala de Enmedio (nur zu Fuß erreichbar). Alle liegen im Naturpark Cabo de Gata-Níjar.'
    condition:
    - type: slot
      name: language
      value: de
  - text: 'Les plages les plus connues sont : Mónsul (emblématique, accès limité en
      été), Genoveses (vaste et préservée), Playazo (près du château de San Ramón)
      et Cala de Enmedio (accessible uniquement à pied). Toutes se trouvent dans le
      Parc Naturel Cabo de Gata-Níjar.'
    condition:
    - type: slot
      name: language
      value: fr
  - text: 'Las playas más conocidas son: Mónsul (icónica, con aforo limitado en verano),
      Genoveses (virgen y muy extensa), Playazo (junto al castillo de San Ramón) y
      Cala de Enmedio (sólo accesible a pie). Todas están dentro del Parque Natural
      Cabo de Gata-Níjar.'
  utter_acceso_playa_monsul:
  - text: Durante la temporada alta (junio a septiembre) el acceso a Mónsul está regulado
      por aforo. Es necesario consultar el sistema de control en la web del Ayuntamiento;
      se recomienda llegar a primera hora o usar el bus lanzadera desde San José.
    condition:
    - type: slot
      name: language
      value: es
  - text: During high season (June to September) Mónsul access is regulated by capacity.
      Check the council's online system; arriving early or using the shuttle bus from
      San José is recommended.
    condition:
    - type: slot
      name: language
      value: en
  - text: In der Hochsaison (Juni bis September) ist der Zugang zu Mónsul kapazitätsgeregelt.
      Prüfen Sie das Online-System der Gemeinde; früh ankommen oder den Pendelbus
      von San José nutzen.
    condition:
    - type: slot
      name: language
      value: de
  - text: En haute saison (juin à septembre) l'accès à Mónsul est régulé par capacité.
      Consultez le système en ligne de la mairie ; arriver tôt ou utiliser la navette
      depuis San José est recommandé.
    condition:
    - type: slot
      name: language
      value: fr
  - text: Durante la temporada alta (junio a septiembre) el acceso a Mónsul está regulado
      por aforo. Es necesario consultar el sistema de control en la web del Ayuntamiento;
      se recomienda llegar a primera hora o usar el bus lanzadera desde San José.
  utter_playas_perro:
  - text: Los perros no están permitidos en las playas de uso público durante la temporada
      de baño (1 de junio a 30 de septiembre), excepto en las playas habilitadas específicamente.
      Consulta los carteles informativos en cada acceso.
    condition:
    - type: slot
      name: language
      value: es
  - text: Dogs are not allowed on public beaches during bathing season (1 June to
      30 September), except on specifically designated beaches. Check the signs at
      each access point.
    condition:
    - type: slot
      name: language
      value: en
  - text: Hunde sind während der Badesaison (1. Juni bis 30. September) an öffentlichen
      Stränden nicht erlaubt, außer an dafür ausgewiesenen Stränden. Beachten Sie
      die Hinweisschilder.
    condition:
    - type: slot
      name: language
      value: de
  - text: Les chiens ne sont pas autorisés sur les plages publiques pendant la saison
      balnéaire (1er juin au 30 septembre), sauf sur les plages spécifiquement désignées.
      Consultez les panneaux à chaque accès.
    condition:
    - type: slot
      name: language
      value: fr
  - text: Los perros no están permitidos en las playas de uso público durante la temporada
      de baño (1 de junio a 30 de septiembre), excepto en las playas habilitadas específicamente.
      Consulta los carteles informativos en cada acceso.
  utter_horario_amoladeras:
  - text: El Centro de Visitantes Las Amoladeras abre, en general, de 10:00 a 14:00.
      En invierno los fines de semana y festivos suele extender el horario hasta las
      15:00. Cierre habitual los lunes. Recomendamos confirmar en el teléfono +34
      950 16 04 35.
    condition:
    - type: slot
      name: language
      value: es
  - text: Las Amoladeras Visitor Center is generally open 10:00-14:00. In winter,
      opening is extended until 15:00 on weekends and public holidays. Closed on Mondays.
      We recommend confirming on +34 950 16 04 35.
    condition:
    - type: slot
      name: language
      value: en
  - text: Das Besucherzentrum Las Amoladeras öffnet in der Regel von 10:00 bis 14:00
      Uhr. Im Winter werden die Öffnungszeiten an Wochenenden und Feiertagen bis 15:00
      Uhr verlängert. Montags geschlossen. Bestätigung unter +34 950 16 04 35.
    condition:
    - type: slot
      name: language
      value: de
  - text: Le Centre des Visiteurs Las Amoladeras est généralement ouvert de 10h00
      à 14h00. En hiver, l'ouverture est prolongée jusqu'à 15h00 les week-ends et
      jours fériés. Fermé le lundi. Confirmation au +34 950 16 04 35.
    condition:
    - type: slot
      name: language
      value: fr
  - text: El Centro de Visitantes Las Amoladeras abre, en general, de 10:00 a 14:00.
      En invierno los fines de semana y festivos suele extender el horario hasta las
