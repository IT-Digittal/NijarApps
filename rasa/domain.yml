  utter_parque_fauna_camaleon:
  - text: Destacan el camaleón común, aves marinas y esteparias, flamencos en las
      salinas y fauna marina en la reserva. Obsérvala sin molestarla ni alimentarla.
    condition:
    - type: slot
      name: language
      value: es
  - text: Highlights include the common chameleon, sea and steppe birds, flamingos
      at the salt flats and marine life in the reserve. Watch without disturbing or
      feeding.
    condition:
    - type: slot
      name: language
      value: en
  - text: 'Höhepunkte: das Chamäleon, See- und Steppenvögel, Flamingos an den Salinen
      und Meeresfauna im Reservat. Beobachten, ohne zu stören oder zu füttern.'
    condition:
    - type: slot
      name: language
      value: de
  - text: 'À voir : le caméléon commun, oiseaux marins et steppiques, flamants aux
