    - type: slot
      name: language
      value: es
  - text: The emergency number in Spain is 112 (24/7, multilingual). For maritime
      emergencies you can also call the Maritime Rescue at 900 202 202.
    condition:
    - type: slot
      name: language
      value: en
  - text: Die Notrufnummer in Spanien ist 112 (24/7, mehrsprachig). Für Seenotfälle
