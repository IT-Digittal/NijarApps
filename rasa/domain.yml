  utter_mejor_epoca_visita:
  - text: 'La primavera (abril-junio) y el otoño (septiembre-octubre) son ideales:
      temperatura agradable, menos masificación y los paisajes están en su mejor momento.
      Julio y agosto son los meses con más afluencia. El invierno es suave y excelente
      para senderismo.'
    condition:
    - type: slot
      name: language
      value: es
  - text: 'Spring (April-June) and autumn (September-October) are ideal: pleasant
      temperature, fewer crowds, and landscapes at their best. July and August are
      the busiest months. Winter is mild and excellent for hiking.'
    condition:
    - type: slot
      name: language
      value: en
  - text: 'Frühling (April-Juni) und Herbst (September-Oktober) sind ideal: angenehme
      Temperaturen, weniger Andrang, Landschaften in Bestform. Juli und August sind
      am stärksten besucht. Der Winter ist mild und ideal zum Wandern.'
    condition:
    - type: slot
      name: language
      value: de
  - text: 'Le printemps (avril-juin) et l''automne (septembre-octobre) sont idéaux
      : température agréable, moins de foule, paysages magnifiques. Juillet et août
      sont les mois les plus fréquentés. L''hiver est doux et excellent pour la randonnée.'
    condition:
    - type: slot
      name: language
      value: fr
  - text: 'La primavera (abril-junio) y el otoño (septiembre-octubre) son ideales:
      temperatura agradable, menos masificación y los paisajes están en su mejor momento.
