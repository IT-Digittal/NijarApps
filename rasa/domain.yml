  utter_gastronomia_reservas:
  - text: En temporada alta (julio-agosto) y fines de semana es muy recomendable reservar,
      sobre todo en los pueblos costeros más demandados como San José o Agua Amarga.
    condition:
    - type: slot
      name: language
      value: es
  - text: In high season (July-August) and at weekends booking is highly recommended,
      especially in the busiest coastal villages like San José or Agua Amarga.
    condition:
    - type: slot
      name: language
      value: en
  - text: In der Hochsaison (Juli-August) und an Wochenenden ist Reservierung sehr
      empfehlenswert, vor allem in beliebten Küstenorten wie San José oder Agua Amarga.
    condition:
    - type: slot
      name: language
      value: de
  - text: En haute saison (juillet-août) et le week-end, la réservation est vivement
      conseillée, surtout dans les villages côtiers prisés comme San José ou Agua
