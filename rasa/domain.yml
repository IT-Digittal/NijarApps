  utter_normativa_parque:
  - text: 'Está prohibido: hacer fuego (incluido barbacoas), acampar fuera de zonas
      habilitadas, recolectar plantas o fauna, salirse de los senderos señalizados,
      circular con vehículos por pistas no autorizadas y dejar residuos de cualquier
      tipo. Es un Parque Natural protegido y Reserva de la Biosfera UNESCO.'
    condition:
    - type: slot
      name: language
      value: es
  - text: 'Forbidden activities: making fires (including barbecues), camping outside
      designated areas, collecting plants or fauna, leaving marked trails, driving
      on unauthorised tracks, and leaving any waste. It is a protected Natural Park
      and UNESCO Biosphere Reserve.'
    condition:
    - type: slot
      name: language
      value: en
  - text: 'Verboten sind: Feuer machen (einschließlich Grillen), Zelten außerhalb
      ausgewiesener Bereiche, Sammeln von Pflanzen oder Tieren, Verlassen markierter
      Wege, Fahren auf nicht genehmigten Wegen und Hinterlassen jeglicher Abfälle.
      Es ist ein geschützter Naturpark und UNESCO-Biosphärenreservat.'
    condition:
    - type: slot
      name: language
      value: de
  - text: 'Sont interdits : faire du feu (y compris barbecues), camper hors des zones
      désignées, ramasser plantes ou faune, sortir des sentiers balisés, circuler
      en véhicule sur des pistes non autorisées, abandonner des déchets. C''est un
      Parc Naturel protégé et Réserve de Biosphère UNESCO.'
    condition:
    - type: slot
      name: language
      value: fr
  - text: 'Está prohibido: hacer fuego (incluido barbacoas), acampar fuera de zonas
      habilitadas, recolectar plantas o fauna, salirse de los senderos señalizados,
      circular con vehículos por pistas no autorizadas y dejar residuos de cualquier
      tipo. Es un Parque Natural protegido y Reserva de la Biosfera UNESCO.'
  utter_ruta_rodalquilar_albaricoques:
  - text: Es una ruta de unos 8,5 km de baja-media dificultad que conecta Rodalquilar
      con Los Albaricoques atravesando paisajes de antiguas minas y la rambla. Está
      señalizada y tiene un tótem digital interactivo en cada extremo con información
      del recorrido.
    condition:
    - type: slot
      name: language
      value: es
  - text: An 8.5 km route of low-medium difficulty connecting Rodalquilar with Los
      Albaricoques across former mining landscapes and the rambla. It is signposted
      and has an interactive digital totem at each end with route information.
    condition:
    - type: slot
      name: language
      value: en
  - text: Eine etwa 8,5 km lange Route mit niedriger bis mittlerer Schwierigkeit,
      die Rodalquilar mit Los Albaricoques durch ehemalige Bergbaulandschaften und
      die Rambla verbindet. Beschildert und mit interaktivem Digital-Totem an jedem
      Ende.
    condition:
    - type: slot
      name: language
      value: de
  - text: Un itinéraire d'environ 8,5 km de difficulté faible à moyenne reliant Rodalquilar
      à Los Albaricoques à travers des paysages miniers et la rambla. Balisé et équipé
      d'un totem numérique interactif à chaque extrémité.
    condition:
    - type: slot
      name: language
      value: fr
  - text: Es una ruta de unos 8,5 km de baja-media dificultad que conecta Rodalquilar
      con Los Albaricoques atravesando paisajes de antiguas minas y la rambla. Está
      señalizada y tiene un tótem digital interactivo en cada extremo con información
