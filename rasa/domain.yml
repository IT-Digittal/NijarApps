  utter_transporte_estado_carreteras:
  - text: Son carreteras secundarias, estrechas y con curvas en algunos tramos hacia
      las calas. Conduce con precaución, respeta a ciclistas y no aparques fuera de
      las zonas habilitadas.
    condition:
    - type: slot
      name: language
      value: es
  - text: They are secondary roads, narrow and winding on some sections to the coves.
      Drive carefully, respect cyclists and do not park outside designated areas.
    condition:
    - type: slot
      name: language
      value: en
  - text: Es sind Nebenstraßen, eng und kurvig auf manchen Abschnitten zu den Buchten.
      Vorsichtig fahren, Radfahrer respektieren und nicht außerhalb ausgewiesener
      Zonen parken.
    condition:
    - type: slot
      name: language
      value: de
  - text: Ce sont des routes secondaires, étroites et sinueuses par endroits vers
      les criques. Conduisez prudemment, respectez les cyclistes et ne stationnez
      pas hors des zones prévues.
    condition:
    - type: slot
      name: language
      value: fr
  - text: Son carreteras secundarias, estrechas y con curvas en algunos tramos hacia
      las calas. Conduce con precaución, respeta a ciclistas y no aparques fuera de
      las zonas habilitadas.
  utter_alojamiento_precios_temporada:
  - text: Sí, en julio y agosto los precios son notablemente más altos y hay estancia
