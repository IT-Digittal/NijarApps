    - type: slot
      name: language
      value: en
  - text: Ein Postamt gibt es in Níjar-Dorf und in anderen Hauptorten wie Campohermoso
      und San Isidro. Öffnungszeiten prüfen, im August reduziert.
    condition:
    - type: slot
      name: language
      value: de
  - text: Il y a un bureau de poste à Níjar village et dans d'autres villages comme
