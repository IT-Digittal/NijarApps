# Configuración del modelo Rasa para el Asistente de Turismo de Níjar.
# La pipeline está optimizada para corpus pequeños y multilingües (ES/EN/DE/FR).
# Documentación: https://rasa.com/docs/rasa/tuning-your-model/

recipe: default.v1
assistant_id: nijar_dti_chatbot

# Idioma principal del corpus de entrenamiento. La cobertura multilingüe
# se obtiene combinando ejemplos por idioma en `data/nlu.yml` con detección
# previa de idioma realizada por la plataforma DTI antes de invocar Rasa.
language: es

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
  - name: FallbackClassifier
    threshold: 0.55
    ambiguity_threshold: 0.10

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.55
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
