name: Accessibility (WCAG 2.1 AA)

# ============================================================================
# Subtarea 5.8 del Plan de Trabajo Pre-SAT - Plataforma DTI Nijar
#
# Workflow BLOQUEANTE: cualquier PR que toque frontend/* o el script de auditoría
# debe pasar la auditoría de accesibilidad antes de poder hacer merge.
#
# Criterios de fallo:
#   - 0 violaciones de severidad CRITICAL o SERIOUS (axe-core)
#   - Score Lighthouse Accesibilidad >= 90/100 en cada página auditada
#
# El workflow:
#   1. Levanta el stack mínimo del proyecto (Postgres, Redis, FastAPI)
#   2. Arranca los frontales en localhost:8000
#   3. Ejecuta Playwright + axe-core + Lighthouse contra las URLs definidas
#   4. Sube el informe HTML como artifact descargable
#   5. Falla el workflow si hay violaciones bloqueantes
# ============================================================================

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/audit-accessibility.*'
      - '.github/workflows/accessibility.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Modo estricto (incluye moderate/minor en informe)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  pull-requests: write   # para comentar resultados en el PR

jobs:
  audit:
    name: Auditoría WCAG 2.1 AA
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nijar
          POSTGRES_PASSWORD: nijar
          POSTGRES_DB: nijar_dti
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar dependencias backend
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Aplicar migraciones de BBDD
        env:
          DATABASE_URL: postgresql+asyncpg://nijar:nijar@localhost:5432/nijar_dti
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head

      - name: Cargar seed mínimo (necesario para que los frontales tengan datos)
        env:
          DATABASE_URL: postgresql+asyncpg://nijar:nijar@localhost:5432/nijar_dti
        run: python -m nijar_dti.scripts.seed_minimal || true

      - name: Arrancar API en background
        env:
          DATABASE_URL: postgresql+asyncpg://nijar:nijar@localhost:5432/nijar_dti
          REDIS_URL: redis://localhost:6379/0
          NIJAR_DTI_ENV: ci
        run: |
          uvicorn nijar_dti.main:app --host 0.0.0.0 --port 8000 &
          echo "API_PID=$!" >> $GITHUB_ENV
          # Esperar a que la API responda (max 60s)
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health 2>/dev/null; then
              echo "API arrancada"; break
            fi
            sleep 1
          done

      - name: Instalar dependencias del script de auditoría
        working-directory: scripts
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Ejecutar auditoría axe-core + Lighthouse
        id: audit
        working-directory: scripts
        env:
          NIJAR_BASE_URL: http://localhost:8000
        run: |
          STRICT=""
          if [[ "${{ github.event.inputs.strict }}" == "true" ]]; then
            STRICT="--strict"
          fi
          node audit-accessibility.js --base=http://localhost:8000 $STRICT

      - name: Subir informe HTML como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-audit-${{ github.run_number }}
          path: reports/accessibility/
          retention-days: 30

      - name: Comentar resultados en el PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const today = new Date().toISOString().slice(0, 10);
            const reportDir = `reports/accessibility/audit-${today}`;
            const findingsPath = `${reportDir}/findings.json`;
            if (!fs.existsSync(findingsPath)) {
              return;
            }
            const findings = JSON.parse(fs.readFileSync(findingsPath, 'utf-8'));
            const totalBlocking = findings.reduce((s, f) =>
              s + (f.violations?.blocking?.length || 0), 0);
            const totalInformative = findings.reduce((s, f) =>
              s + (f.violations?.informative?.length || 0), 0);
            const passed = totalBlocking === 0;
            const verdict = passed ? '✅ **AUDITORÍA SUPERADA**' : '❌ **AUDITORÍA FALLIDA**';
            const summary = findings.map(f => {
              const b = f.violations?.blocking?.length || 0;
              const i = f.violations?.informative?.length || 0;
              const lh = f.lighthouse?.score ?? '—';
              const icon = b === 0 ? '✅' : '❌';
              return `${icon} **${f.page.name}** — ${b} bloqueantes · ${i} info · Lighthouse ${lh}/100`;
            }).join('\n');
            const body = `## Auditoría de Accesibilidad WCAG 2.1 AA\n\n${verdict}\n\n**Total:** ${totalBlocking} bloqueantes · ${totalInformative} informativas\n\n### Por página\n\n${summary}\n\n📄 Informe HTML completo descargable en los **artifacts** del workflow.\n\n_Subtarea 5.8 del Plan Pre-SAT · Plataforma DTI Níjar_`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Detener API
        if: always()
        run: |
          if [ -n "$API_PID" ]; then kill $API_PID || true; fi
