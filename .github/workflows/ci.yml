name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests + lint + tipado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Format check (ruff)
        run: ruff format --check src/ tests/
      - name: Type check (mypy)
        run: mypy src/nijar_dti
      - name: Tests con cobertura
        run: pytest tests/ --cov=nijar_dti --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: coverage.xml }

  security-deps:
    name: Dependencias (pip-audit + osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: pip-audit
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --strict --vulnerability-service osv
      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  security-sast:
    name: SAST (semgrep + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar herramientas
        run: pip install semgrep bandit[toml]
      - name: Bandit
        run: bandit -ll -r src/nijar_dti -f json -o bandit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: bandit-report, path: bandit.json }
      - name: Semgrep — OWASP Top 10
        run: semgrep --config p/owasp-top-ten --config p/python --config p/security-audit --error src/

  security-image:
    name: Imagen Docker (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen para escaneo
        run: docker build -t nijar-dti-api:ci .
      - name: Trivy — vulnerabilidades alto/crítico bloquean
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'nijar-dti-api:ci'
          format: 'sarif'
          output: 'trivy.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }

  accessibility:
    name: Accesibilidad (pa11y / axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Instalar pa11y-ci
        run: npm install -g pa11y-ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Servir frontend estático
        run: |
          cd frontend
          python -m http.server 8080 &
          sleep 2
      - name: Pa11y dashboard + tótem
        run: |
          pa11y-ci --standard WCAG2AA http://localhost:8080/dashboard/index.html || true
          pa11y-ci --standard WCAG2AA http://localhost:8080/totem/index.html || true

  infra-validate:
    name: Validar Terraform + K8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.6.6 }
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
      - name: kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -strict -ignore-missing-schemas -summary infra/k8s/

  ci-summary:
    name: Resumen CI
    runs-on: ubuntu-latest
    needs: [test, security-deps, security-sast, security-image, infra-validate]
    if: always()
    steps:
      - run: |
          fail=0
          for r in "${{ needs.test.result }}" "${{ needs.security-deps.result }}" "${{ needs.security-sast.result }}" "${{ needs.security-image.result }}" "${{ needs.infra-validate.result }}"; do
            if [[ "$r" != "success" ]]; then fail=1; fi
          done
          if [[ $fail -ne 0 ]]; then echo "Hay jobs fallidos"; exit 1; fi
          echo "✓ Todos los checks pasaron"
