name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests + lint + tipado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Format check (ruff)
        run: ruff format --check src/ tests/
      - name: Type check (mypy)
        run: mypy src/nijar_dti
      - name: Tests con cobertura
        run: pytest tests/ --cov=nijar_dti --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: coverage.xml }

  security-deps:
    name: Dependencias (pip-audit + osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: pip-audit
        run: |
          pip install pip-audit
          pip install -e .
          # CVEs sin fix upstream en dependencias transitivas de python-jose (ecdsa)
          # y en setuptools del entorno de build; se documentan y se revisan periódicamente.
          pip-audit --strict --vulnerability-service osv \
            --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-3447
      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  security-sast:
    name: SAST (semgrep + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar herramientas
        run: pip install semgrep bandit[toml]
      - name: Bandit
        run: bandit -ll -c pyproject.toml -r src/nijar_dti -f json -o bandit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: bandit-report, path: bandit.json }
      - name: Semgrep — OWASP Top 10
        run: semgrep --config p/owasp-top-ten --config p/python --config p/security-audit --error src/

  security-image:
    name: Imagen Docker (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen para escaneo
        run: docker build -t nijar-dti-api:ci .
      - name: Instalar Trivy (CLI, repo oficial apt)
        run: |
          sudo apt-get install -y --no-install-recommends wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy — informe de vulnerabilidades (tabla + JSON)
        run: |
          # Informe legible en el log: alto/crítico con fix disponible.
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --format table --output trivy-report.txt nijar-dti-api:ci
          echo "===== Trivy: CRITICAL/HIGH con fix disponible ====="
          cat trivy-report.txt
          # JSON completo para el artefacto descargable.
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --format json --output trivy.json nijar-dti-api:ci
      - name: Trivy — gate bloqueante (solo CRÍTICO con fix)
        run: |
          # Bloquea únicamente ante vulnerabilidades CRÍTICAS con parche
          # disponible. Las de severidad HIGH del sistema base se informan
          # (log + artefacto) pero no bloquean el PR; el escaneo nocturno
          # mantiene la foto completa (CRITICAL..LOW).
          trivy image --severity CRITICAL --ignore-unfixed \
            --exit-code 1 nijar-dti-api:ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy.json

  accessibility:
    name: Accesibilidad (pa11y / axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Instalar pa11y-ci
        run: npm install -g pa11y-ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Servir frontend estático
        run: |
          cd frontend
          python -m http.server 8080 &
          sleep 2
      - name: Pa11y dashboard + tótem
        run: |
          pa11y-ci --standard WCAG2AA http://localhost:8080/dashboard/index.html || true
          pa11y-ci --standard WCAG2AA http://localhost:8080/totem/index.html || true

  infra-validate:
    name: Validar Terraform + K8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.6.6 }
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
      - name: kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -strict -ignore-missing-schemas -summary infra/k8s/

  ci-summary:
    name: Resumen CI
    runs-on: ubuntu-latest
    needs: [test, security-deps, security-sast, security-image, infra-validate]
    if: always()
    steps:
      - run: |
          fail=0
          for r in "${{ needs.test.result }}" "${{ needs.security-deps.result }}" "${{ needs.security-sast.result }}" "${{ needs.security-image.result }}" "${{ needs.infra-validate.result }}"; do
            if [[ "$r" != "success" ]]; then fail=1; fi
          done
          if [[ $fail -ne 0 ]]; then echo "Hay jobs fallidos"; exit 1; fi
          echo "✓ Todos los checks pasaron"
