name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno destino'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read
  id-token: write   # OIDC con AWS
  packages: write

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: nijar-dti-production/api
  EKS_CLUSTER_NAME: nijar-dti-production
  K8S_NAMESPACE: nijar-dti

jobs:
  build-and-push:
    name: Build + push imagen a ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_uri: ${{ steps.meta.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar tag único
        id: meta
        run: |
          SHA=${GITHUB_SHA::8}
          TS=$(date -u +%Y%m%d%H%M%S)
          TAG="${TS}-${SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=$AWS_ECR_REGISTRY/$ECR_REPOSITORY:${TAG}" >> $GITHUB_OUTPUT

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen Docker
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} \
            --tag ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Trivy escaneo final pre-push (bloqueante)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: '${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Push a ECR
        run: |
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Desplegar a EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Aplicar migraciones Alembic
        run: |
          # Ejecutamos el Job de migración con la nueva imagen
          IMAGE="${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:${{ needs.build-and-push.outputs.image_tag }}"
          sed "s|ECR_REPO_URL|$(echo $IMAGE | sed 's|:.*||')|g; s|:latest|:${{ needs.build-and-push.outputs.image_tag }}|g" \
            infra/k8s/30-workers.yaml > /tmp/workers.yaml
          kubectl delete job -n $K8S_NAMESPACE nijar-migrate --ignore-not-found
          kubectl apply -f /tmp/workers.yaml
          kubectl wait --for=condition=complete --timeout=300s -n $K8S_NAMESPACE job/nijar-migrate

      - name: Actualizar Deployment de la API
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:${{ needs.build-and-push.outputs.image_tag }}"
          kubectl set image -n $K8S_NAMESPACE deployment/nijar-api api=$IMAGE
          kubectl rollout status -n $K8S_NAMESPACE deployment/nijar-api --timeout=600s

      - name: Actualizar workers
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:${{ needs.build-and-push.outputs.image_tag }}"
          kubectl set image -n $K8S_NAMESPACE deployment/nijar-mqtt-subscriber subscriber=$IMAGE
          kubectl set image -n $K8S_NAMESPACE deployment/nijar-social-worker worker=$IMAGE
          kubectl rollout status -n $K8S_NAMESPACE deployment/nijar-mqtt-subscriber --timeout=300s
          kubectl rollout status -n $K8S_NAMESPACE deployment/nijar-social-worker --timeout=300s

      - name: Smoke test post-deploy
        run: |
          for i in {1..30}; do
            if curl -fsSL https://api.dti.nijar.es/api/v1/health | grep -q '"status":"ok"'; then
              echo "✓ API responde correctamente"
              exit 0
            fi
            sleep 5
          done
          echo "✗ Smoke test fallido"
          exit 1

      - name: Notificar despliegue
        if: always()
        run: |
          echo "Despliegue ${{ job.status }} de la imagen ${{ needs.build-and-push.outputs.image_tag }}"
